name: Reconcile Framer historical dates

on:
  push:
    branches:
      - framer-reconciliation-2026-09-25
    paths:
      - "docs/framer/framer-post-22-08-reconciliation-2026-09-25.json"
      - "content/noticias/**"
      - ".github/workflows/framer-reconcile-dates.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Framer publication dates
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path

          inventory = json.loads(Path("docs/framer/framer-post-22-08-reconciliation-2026-09-25.json").read_text(encoding="utf-8"))
          files = list(Path("content/noticias").glob("*.md"))

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(c for c in value if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]+", "-", value.casefold()).strip("-")

          by_norm = {norm(p.stem): p for p in files}
          updated = 0
          unchanged = 0
          missing = []
          for item in inventory:
              raw_path = item.get("indexPath")
              path = Path(raw_path) if raw_path else by_norm.get(norm(item.get("title", "")))
              if path is None or not path.exists():
                  missing.append(item.get("title", item.get("slug", "")))
                  continue
              text = path.read_text(encoding="utf-8-sig")
              date = str(item["framerPublished"])[:10]
              match = re.search(r'(?m)^((?:published|date|dataNoticia|data)\s*:\s*)\S+\s*$', text)
              if not match:
                  raise SystemExit(f"publication metadata field missing: {path}")
              new_text = text[:match.start()] + match.group(1) + f'"{date}"' + text[match.end():]
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  updated += 1
              else:
                  unchanged += 1

          if len(inventory) != 163:
              raise SystemExit(f"Unexpected inventory size: {len(inventory)}")
          if missing:
              raise SystemExit(f"Missing reconciliation targets: {len(missing)}; first={missing[:3]}")
          if updated + unchanged != 163:
              raise SystemExit(f"Count mismatch: updated={updated}, unchanged={unchanged}")
          print(f"Reconciled {updated} files; {unchanged} already correct; 163 total.")

      - name: Commit reconciled dates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/noticias
          if git diff --cached --quiet; then
            echo "No article date changes required."
            exit 0
          fi
          git commit -m "content: reconcile all verified Framer publication dates"
          git push
