name: Gerar índice de notícias

on:
  push:
    branches:
      - main
      - fase-2-performance-noticias
      - fase-0a-foundation
      - fase-2a-taxonomia-autores
    paths:
      - "content/noticias/**"
      - "content/taxonomia.json"
      - "content/authors.json"
      - "content/editorial-types.json"
      - ".github/workflows/gerar-indice-noticias.yml"

permissions:
  contents: write

jobs:
  gerar-indice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar índice
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path

          root = Path("content/noticias")
          output = Path("content/noticias-index.json")
          taxonomy = json.loads(Path("content/taxonomia.json").read_text(encoding="utf-8"))
          authors = json.loads(Path("content/authors.json").read_text(encoding="utf-8"))
          editorial_types = {
              item["id"] for item in json.loads(
                  Path("content/editorial-types.json").read_text(encoding="utf-8")
              )
          }

          def normalize_key(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(char for char in value if not unicodedata.combining(char))
              return "".join(char for char in value.casefold() if char.isalnum())

          categories_by_alias = {}
          for item in taxonomy["categories"]:
              for alias in [item["label"], *item.get("aliases", [])]:
                  categories_by_alias[normalize_key(alias)] = item

          authors_by_alias = {}
          for item in authors:
              for alias in [item["name"], *item.get("aliases", [])]:
                  authors_by_alias[normalize_key(alias)] = item

          def parse_scalar(value):
              value = value.strip()
              if not value:
                  return ""
              if value.startswith('"') and value.endswith('"'):
                  try:
                      return json.loads(value)
                  except Exception:
                      return value[1:-1]
              if value.startswith("'") and value.endswith("'"):
                  return value[1:-1].replace("''", "'")
              return value

          def field(frontmatter, names):
              for name in names:
                  match = re.search(
                      rf"^\s*{re.escape(name)}\s*:\s*(.*?)\s*$",
                      frontmatter,
                      re.MULTILINE
                  )
                  if match:
                      return parse_scalar(match.group(1))
              return ""

          noticias = []

          for path in sorted(root.glob("*.md")):
              text = path.read_text(encoding="utf-8-sig")
              match = re.match(
                  r"^---\s*\n([\s\S]*?)\n---(?:\s*\n|$)",
                  text
              )
              if not match:
                  continue

              frontmatter = match.group(1)

              slug = field(frontmatter, ["slug"]) or path.stem
              title = field(frontmatter, ["title"]) or "Sem título"
              subtitle = field(
                  frontmatter,
                  ["subtitle", "subtitulo", "descricao", "resumo"]
              )
              category_raw = field(
                  frontmatter,
                  ["category", "categoria", "tag"]
              ) or "Geral"
              category_meta = categories_by_alias.get(normalize_key(category_raw))
              category = category_meta["label"] if category_meta else category_raw
              editorial_type = field(frontmatter, ["type"]) or "news"
              if editorial_type not in editorial_types:
                  raise ValueError(f"Tipo editorial não registado em {path}: {editorial_type}")
              author_raw = field(frontmatter, ["author", "autor"])
              author_meta = authors_by_alias.get(normalize_key(author_raw))
              author = author_meta["name"] if author_meta else author_raw
              published = field(
                  frontmatter,
                  ["published", "date", "dataNoticia", "data"]
              )
              modified = field(frontmatter, ["modified", "dateModified", "updated"])
              image = field(
                  frontmatter,
                  ["image", "imagem", "featured_image", "featuredImage"]
              )

              noticia = {
                  "slug": slug,
                  "path": str(path).replace("\\", "/"),
                  "type": editorial_type,
                  "title": title,
                  "subtitle": subtitle,
                  "category": category,
                  "categoryId": category_meta["id"] if category_meta else None,
                  "categoryKind": category_meta["kind"] if category_meta else "unclassified",
                  "author": author,
                  "authorId": author_meta["id"] if author_meta else None,
                  "authorType": author_meta["type"] if author_meta else None,
                  "published": published,
                  "image": image
              }
              if modified:
                  noticia["modified"] = modified
              noticias.append(noticia)

          noticias.sort(
              key=lambda item: item.get("published") or "",
              reverse=True
          )

          output.write_text(
              json.dumps(
                  noticias,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # Gera sitemap no mesmo passo a partir das páginas públicas e do índice derivado dos Markdown.
          from datetime import date
          from urllib.parse import quote
          from html import escape

          base_url = "https://chutapracanto.pages.dev"
          pages = ["/", "/noticias", "/sobre", "/contacto", "/privacidade", "/termos"]
          entries = [base_url + page for page in pages]
          today = date.today().isoformat()
          for noticia in noticias:
              slug = noticia.get("slug")
              path = noticia.get("path", "")
              if not slug or not re.fullmatch(r"content/noticias/[^/]+\.md", path) or ".." in path:
                  continue
              published = (noticia.get("published") or "")[:10]
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}", published) and published > today:
                  continue
              entries.append(base_url + "/noticia?slug=" + quote(slug, safe="~!*'()-._"))

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for loc in dict.fromkeys(entries):
              sitemap_lines.append("  <url><loc>" + escape(loc, quote=False) + "</loc></url>")
          sitemap_lines.append("</urlset>")
          Path("sitemap.xml").write_text(
              "\n".join(sitemap_lines) + "\n",
              encoding="utf-8"
          )

      - name: Commit índice atualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/noticias-index.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Índice já está atualizado."
            exit 0
          fi
          git commit -m "Atualizar índice de notícias"
          git push
