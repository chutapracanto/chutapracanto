name: Importar arquivo histórico Framer (execução única)

on:
  push:
    paths:
      - "scripts/import-framer-news.py"
      - ".github/workflows/importar-framer-uma-vez.yml"

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Importar sem sobrescrever existentes
        run: python scripts/import-framer-news.py --limit 0 --write

      - name: Commit artigos importados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/noticias
          if git diff --cached --quiet; then
            echo "Nenhum artigo novo para importar."
            exit 0
          fi
          git commit -m "content: importar arquivo histórico do Framer"
          git push
