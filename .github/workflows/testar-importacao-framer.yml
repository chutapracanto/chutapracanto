name: Testar importação histórica do Framer

on:
  push:
    paths:
      - "scripts/import-framer-news.py"
      - ".github/workflows/testar-importacao-framer.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Número máximo de notícias a testar (0 = todas)"
        required: false
        default: "20"

permissions:
  contents: write
  statuses: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Executar importação/teste
        env:
          LIMIT: ${{ inputs.limit || '20' }}
          FRAMER_DEBUG: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if git log -1 --pretty=%B | grep -Fq "[IMPORT-FRAMER-REAL]"; then
              echo "IMPORT-FRAMER-REAL encontrado: execução de escrita autorizada."
              python scripts/import-framer-news.py --limit 0 --write
            else
              echo "Sem [IMPORT-FRAMER-REAL]: execução protegida em dry-run."
              python scripts/import-framer-news.py --limit 0
            fi
          else
            python scripts/import-framer-news.py --limit "$LIMIT"
          fi

      - name: Diagnóstico de ficheiros escritos
        if: always()
        run: |
          echo "FILES=$(find content/noticias -maxdepth 1 -type f -name '*.md' | wc -l)"
          echo "STATUS:"
          git status --short --untracked-files=all | head -30

      - name: Commit artigos importados
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content/noticias
          if git diff --cached --quiet; then
            echo "Nenhum artigo novo para importar."
            exit 0
          fi
          git commit -m "content: importar arquivo histórico do Framer"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Mostrar diagnóstico do relatório
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          r=json.load(open('/tmp/framer-import-report.json',encoding='utf-8'))
          print('DIAGNOSTICO_FRAMER', json.dumps({
              'listingUrls': r['listingUrls'],
              'readyToImport': r['readyToImport'],
              'skipped': r['skipped'],
              'failed': r['failed'],
              'skipReasons': Counter(reason for _, reason in r['skippedItems']),
              'sampleSkipped': r['skippedItems'][:10],
              'sampleFailed': r['failedItems'][:10],
          }, ensure_ascii=False, default=dict))
          PY

      - name: Publicar resumo no commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          p='/tmp/framer-import-report.json'
          try:
              r=json.load(open(p,encoding='utf-8'))
              desc=f"Framer: URLs={r['listingUrls']} | prontos={r['readyToImport']} | ignorados={r['skipped']} | falhas={r['failed']}"
              state='success' if r['failed'] == 0 else 'failure'
          except Exception as e:
              desc=f'Framer dry-run sem relatório: {e}'
              state='failure'
          subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/statuses/{os.environ["GITHUB_SHA"]}','-f',f'state={state}','-f','context=framer-dry-run','-f',f'description={desc[:140]}','-f',f'target_url=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'],check=False)
          PY

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framer-import-report
          path: /tmp/framer-import-report.json
          if-no-files-found: error
          if: always()
