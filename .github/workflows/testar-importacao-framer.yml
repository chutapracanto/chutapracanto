name: Testar importação histórica do Framer

on:
  push:
    paths:
      - "scripts/import-framer-news.py"
      - ".github/workflows/testar-importacao-framer.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Número máximo de notícias a testar (0 = todas)"
        required: false
        default: "20"

permissions:
  contents: read
  statuses: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Executar dry-run
        env:
          LIMIT: ${{ inputs.limit || '20' }}
        run: python scripts/import-framer-news.py --limit "$LIMIT"

      - name: Publicar resumo no commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          p='/tmp/framer-import-report.json'
          try:
              r=json.load(open(p,encoding='utf-8'))
              desc=f"Framer: URLs={r['listingUrls']} | prontos={r['readyToImport']} | ignorados={r['skipped']} | falhas={r['failed']}"
              state='success' if r['failed'] == 0 else 'failure'
          except Exception as e:
              desc=f'Framer dry-run sem relatório: {e}'
              state='failure'
          subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/statuses/{os.environ["GITHUB_SHA"]}','-f',f'state={state}','-f','context=framer-dry-run','-f',f'description={desc[:140]}'],check=False)
          PY

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framer-import-report
          path: /tmp/framer-import-report.json
          if-no-files-found: error
          if: always()
