name: Testar importação histórica do Framer

on:
  push:
    paths:
      - "scripts/import-framer-news.py"
      - ".github/workflows/testar-importacao-framer.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Número máximo de notícias a testar (0 = todas)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Executar dry-run
        env:
          LIMIT: ${{ inputs.limit || '20' }}
        run: python scripts/import-framer-news.py --limit "$LIMIT"

      - name: Guardar relatório
        uses: actions/upload-artifact@v4
        with:
          name: framer-import-report
          path: /tmp/framer-import-report.json
          if-no-files-found: error
          if: always()
