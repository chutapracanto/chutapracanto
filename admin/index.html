<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | ChutaPraCanto</title>

    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;

        }

        .panel {
            background: #fff;

        .secondary-btn {
            background: #e5e7eb;

        }

            margin-top: 5px;
            word-break: break-all;
        }

        .edit-btn {
            flex-shrink: 0;
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .edit-btn:hover {
            background: #1d4ed8;
        }

        .pagination {
            display: flex;
            justify-content: center;

            gap: 6px;

        }

        .page-btn {
            min-width: 38px;

            padding: 0 10px;
            border: 1px solid #d1d5db;

            font-weight: 600;
        }

        .page-btn:hover {

        }

        }

        .page-btn:disabled {
            opacity: 0.45;

        }

        .page-info {

        }

        .login-box {

        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .hidden {
            display: none !important;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .mode-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .image-preview {
            max-width: 220px;

            margin-top: 10px;

        }

        .image-help {
            font-size: 12px;
            color: #777;

        }

        @media (max-width: 650px) {

            body {
                padding: 10px;
            }

            .panel {
                padding: 20px;
            }

            .news-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .edit-btn {
                width: 100%;
            }

                gap: 4px;
            }

            .page-btn {
                min-width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login-screen" class="panel login-box">

        <h2>Acesso ao Painel</h2>

        <div class="form-group">

            <label>GitHub Personal Access Token</label>

            <input
                type="password"
                id="github-token"
                placeholder="Cola aqui o teu token"
            >

        </div>

        <button class="main-btn" onclick="salvarToken()">
            Entrar
        </button>

    </div>


    <!-- ADMIN -->
    <div id="admin-screen" class="panel hidden">

        <!-- LISTA -->
        <div id="list-screen">

            <div class="top-actions">

                <h1>📰 Notícias</h1>

                <button
                    class="main-btn"
                    onclick="novaNoticia()"
                >
                    + Nova Notícia
                </button>

            </div>


            <input
                type="text"
                id="search-news"
                class="search"
                placeholder="Pesquisar por título, categoria ou autor..."
                oninput="filtrarLista()"
            >


            <div id="news-list" class="news-list">

                <div class="loading">
                    A carregar notícias...
                </div>

            </div>


            <div id="pagination" class="pagination"></div>

        </div>


        <!-- FORMULÁRIO -->
        <div id="form-screen" class="hidden">

            <div class="top-actions">

                <div>

                    <h1 id="form-title">
                        Nova Notícia
                    </h1>

                    <div
                        class="mode-label"
                        id="mode-label"
                    ></div>

                </div>


                <button
                    class="secondary-btn"
                    onclick="voltarLista()"
                >
                    ← Voltar às notícias
                </button>

            </div>


            <div class="form-group">

                <label>Título</label>

                <input
                    type="text"
                    id="noticia-titulo"
                    placeholder="Título da notícia..."
                >

            </div>


            <div class="form-group">

                <label>Subtítulo / Descrição Curta</label>

                <textarea
                    id="noticia-subtitulo"
                    placeholder="Breve resumo..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>Categoria</label>

                <input
                    type="text"
                    id="noticia-categoria"
                    placeholder="Ex.: SL BENFICA"
                >

            </div>


            <div class="form-group">

                <label>Data</label>

                <input
                    type="date"
                    id="noticia-data"
                >

            </div>


            <div class="form-group">

                <label>Autor</label>

                <input
                    type="text"
                    id="noticia-autor"
                    value="ChutaPraCanto"
                >

            </div>


            <div class="form-group">

                <label>Imagem (Upload ou URL)</label>

                <input
                    type="file"
                    id="image-upload"
                    accept="image/*"
                    style="margin-bottom:8px;"
                >

                <input
                    type="text"
                    id="noticia-imagem-url"
                    placeholder="Ou cola aqui o URL da imagem..."
                >

                <div class="image-help">
                    As imagens carregadas recebem automaticamente um nome único.
                </div>

                <img
                    id="image-preview"
                    class="image-preview"
                >

            </div>


            <div class="form-group">

                <label>Conteúdo do Artigo</label>

                <div id="editor-container"></div>

            </div>


            <div class="form-actions">

                <button
                    class="main-btn"
                    onclick="guardarNoticia()"
                >
                    <span id="save-button-text">
                        Publicar Notícia
                    </span>
                </button>


                <button
                    id="delete-button"
                    class="danger-btn hidden"
                    onclick="apagarNoticia()"
                >
                    Apagar Notícia
                </button>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </div>

</div>


<script src="https://unpkg.com/turndown/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>


<script>

const REPO = "chutapracanto/chutapracanto";
const BRANCH = "main";

const NOTICIAS_POR_PAGINA = 10;

let noticias = [];
let noticiasFiltradas = [];
let paginaAtual = 1;

let noticiaEmEdicao = null;
let quill = null;


// ============================================================
// LOGIN
// ============================================================

function salvarToken() {

    const token =
        document
            .getElementById("github-token")
            .value
            .trim();

    if (!token) {

        alert(
            "Cola primeiro o teu GitHub Personal Access Token."
        );

        return;
    }

    localStorage.setItem(
        "gh_token_cpc",
        token
    );

    location.reload();
}


function getToken() {

    return localStorage.getItem(
        "gh_token_cpc"
    );
}


// ============================================================
// GITHUB
// ============================================================

async function githubFetch(
    url,
    options = {}
) {

    const token = getToken();

    if (!token) {

        throw new Error(
            "Token do GitHub não encontrado."
        );
    }

    const headers = {

        "Authorization":
            `token ${token}`,

        "Accept":
            "application/vnd.github+json",

        ...options.headers
    };


    const response = await fetch(
        url,
        {
            ...options,
            headers
        }
    );


    if (!response.ok) {

        let errorMessage =
            `Erro GitHub: ${response.status}`;


        try {

            const data =
                await response.json();

            if (data.message) {

                errorMessage +=
                    ` - ${data.message}`;
            }

        } catch (e) {}


        throw new Error(
            errorMessage
        );
    }


    return response;
}


// ============================================================
// QUILL
// ============================================================

function iniciarEditor() {

    if (quill) return;


    quill = new Quill(
        "#editor-container",
        {

            theme: "snow",

            placeholder:
                "Escreve ou cola aqui o texto da notícia...",

            modules: {

                toolbar: [

                    [
                        "bold",
                        "italic",
                        "underline"
                    ],

                    [
                        {
                            "header": [3, false]
                        }
                    ],

                    [
                        "blockquote",
                        "list"
                    ],

                    [
                        "clean"
                    ]

                ]
            }
        }
    );
}


// ============================================================
// LISTA DE NOTÍCIAS
// ============================================================

async function carregarNoticias() {

    const container =
        document.getElementById(
            "news-list"
        );


    const pagination =
        document.getElementById(
            "pagination"
        );


    container.innerHTML =
        '<div class="loading">A carregar notícias...</div>';

    pagination.innerHTML = "";


    try {

        let todosOsFicheiros = [];

        let page = 1;


        while (true) {

            const response =
                await githubFetch(
                    `https://api.github.com/repos/${REPO}/contents/content/noticias?ref=${BRANCH}&per_page=100&page=${page}`
                );


            const files =
                await response.json();


            const mdFiles =
                files.filter(
                    file =>
                        file.type === "file" &&
                        file.name
                            .toLowerCase()
                            .endsWith(".md")
                );


            todosOsFicheiros.push(
                ...mdFiles
            );


            if (files.length < 100) {
                break;
            }


            page++;
        }


        const noticiasComDados =
            await Promise.all(

                todosOsFicheiros.map(
                    async file => {

                        try {

                            const response =
                                await githubFetch(
                                    `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(file.path)}?ref=${BRANCH}`
                                );


                            const data =
                                await response.json();


                            const markdown =
                                decodeBase64(
                                    data.content
                                );


                            const parsed =
                                separarFrontmatter(
                                    markdown
                                );


                            const fields =
                                parsed.fields;


                            const dataNoticia =
                                obterCampo(
                                    fields,
                                    "date",
                                    "published"
                                );


                            const titulo =
                                obterCampo(
                                    fields,
                                    "title"
                                );


                            const categoria =
                                obterCampo(
                                    fields,
                                    "categoria",
                                    "category",
                                    "tag"
                                );


                            const autor =
                                obterCampo(
                                    fields,
                                    "author"
                                );


                            const subtitulo =
                                obterCampo(
                                    fields,
                                    "subtitulo",
                                    "subtitle",
                                    "descricao",
                                    "resumo"
                                );


                            return {

                                ...file,

                                titulo:
                                    titulo ||
                                    slugParaTitulo(
                                        file.name
                                    ),

                                categoria:
                                    categoria || "",

                                autor:
                                    autor || "",

                                subtitulo:
                                    subtitulo || "",

                                dataNoticia:
                                    dataNoticia
                                        ? dataNoticia.substring(0, 10)
                                        : ""
                            };


                        } catch (e) {

                            return {

                                ...file,

                                titulo:
                                    slugParaTitulo(
                                        file.name
                                    ),

                                categoria: "",

                                autor: "",

                                subtitulo: "",

                                dataNoticia: ""
                            };
                        }
                    }
                )
            );


        noticias =
            noticiasComDados.sort(
                (a, b) => {

                    if (
                        a.dataNoticia &&
                        b.dataNoticia
                    ) {

                        return b.dataNoticia
                            .localeCompare(
                                a.dataNoticia
                            );
                    }


                    if (a.dataNoticia) {
                        return -1;
                    }


                    if (b.dataNoticia) {
                        return 1;
                    }


                    return b.name.localeCompare(
                        a.name,
                        "pt"
                    );
                }
            );


        noticiasFiltradas =
            [...noticias];


        paginaAtual = 1;


        mostrarLista(
            noticiasFiltradas
        );

    } catch (error) {

        container.innerHTML = `

            <div class="loading">

                Não foi possível carregar as notícias.

                <br><br>

                ${escaparHtml(
                    error.message
                )}

            </div>
        `;
    }
}


// ============================================================
// MOSTRAR LISTA
// ============================================================

function mostrarLista(lista) {

    const container =
        document.getElementById(
            "news-list"
        );


    const pagination =
        document.getElementById(
            "pagination"
        );


    if (!lista.length) {

        container.innerHTML = `

            <div class="loading">
                Não existem notícias.
            </div>

        `;

        pagination.innerHTML = "";

        return;
    }


    const totalPaginas =
        Math.ceil(
            lista.length /
            NOTICIAS_POR_PAGINA
        );


    if (paginaAtual > totalPaginas) {

        paginaAtual =
            totalPaginas;
    }


    const inicio =
        (paginaAtual - 1) *
        NOTICIAS_POR_PAGINA;


    const fim =
        inicio +
        NOTICIAS_POR_PAGINA;


    const noticiasDaPagina =
        lista.slice(
            inicio,
            fim
        );


    container.innerHTML =
        noticiasDaPagina
            .map(file => {

                const titulo =
                    file.titulo ||
                    slugParaTitulo(
                        file.name
                    );


                const categoria =
                    file.categoria ||
                    "";


                return `

                    <div class="news-item">

                        <div class="news-info">

                            <div class="news-title">

                                ${escaparHtml(
                                    titulo
                                )}

                            </div>


                            <div class="news-meta">

                                ${
                                    categoria
                                        ? `
                                            <span class="news-category">
                                                ${escaparHtml(
                                                    categoria
                                                )}
                                            </span>
                                        `
                                        : ""
                                }


                                <span class="news-date">

                                    ${
                                        file.dataNoticia
                                            ? `📅 ${escaparHtml(
                                                file.dataNoticia
                                            )}`
                                            : "📅 Sem data"
                                    }

                                </span>

                            </div>


                            <div class="news-file">

                                ${escaparHtml(
                                    file.name
                                )}

                            </div>

                        </div>


                        <button
                            class="edit-btn"
                            onclick="editarNoticia('${escaparHtml(file.path)}')"
                        >
                            Editar
                        </button>

                    </div>

                `;

            })
            .join("");


    mostrarPaginacao(
        totalPaginas,
        lista.length
    );
}


// ============================================================
// PAGINAÇÃO
// ============================================================

function mostrarPaginacao(
    totalPaginas,
    totalResultados
) {

    const pagination =
        document.getElementById(
            "pagination"
        );


    if (
        totalPaginas <= 1
    ) {

        pagination.innerHTML = `
            <div class="page-info">
                ${totalResultados} notícia${totalResultados === 1 ? "" : "s"}
            </div>
        `;

        return;
    }


    let html = "";


    html += `

        <button
            class="page-btn"
            onclick="mudarPagina(${paginaAtual - 1})"
            ${paginaAtual === 1 ? "disabled" : ""}
        >
            ←
        </button>

    `;


    for (
        let i = 1;
        i <= totalPaginas;
        i++
    ) {

        html += `

            <button
                class="page-btn ${i === paginaAtual ? "active" : ""}"
                onclick="mudarPagina(${i})"
            >
                ${i}
            </button>

        `;
    }


    html += `

        <span class="page-info">
            ${totalResultados} notícias
        </span>

    `;


    html += `

        <button
            class="page-btn"
            onclick="mudarPagina(${paginaAtual + 1})"
            ${paginaAtual === totalPaginas ? "disabled" : ""}
        >
            →
        </button>

    `;


    pagination.innerHTML =
        html;
}


function mudarPagina(numero) {

    const totalPaginas =
        Math.ceil(
            noticiasFiltradas.length /
            NOTICIAS_POR_PAGINA
        );


    if (
        numero < 1 ||
        numero > totalPaginas
    ) {
        return;
    }


    paginaAtual =
        numero;


    mostrarLista(
        noticiasFiltradas
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// ============================================================
// PESQUISA
// ============================================================

function filtrarLista() {

    const termo =
        document
            .getElementById(
                "search-news"
            )
            .value
            .trim()
            .toLowerCase();


    if (!termo) {

        noticiasFiltradas =
            [...noticias];

        paginaAtual = 1;

        mostrarLista(
            noticiasFiltradas
        );

        return;
    }


    noticiasFiltradas =
        noticias.filter(
            file => {

                const titulo =
                    (
                        file.titulo ||
                        ""
                    ).toLowerCase();


                const categoria =
                    (
                        file.categoria ||
                        ""
                    ).toLowerCase();


                const autor =
                    (
                        file.autor ||
                        ""
                    ).toLowerCase();


                const subtitulo =
                    (
                        file.subtitulo ||
                        ""
                    ).toLowerCase();


                const nomeFicheiro =
                    file.name
                        .toLowerCase();


                return (

                    titulo.includes(termo) ||

                    categoria.includes(termo) ||

                    autor.includes(termo) ||

                    subtitulo.includes(termo) ||

                    nomeFicheiro.includes(termo)

                );
            }
        );


    paginaAtual = 1;


    mostrarLista(
        noticiasFiltradas
    );
}


function slugParaTitulo(filename) {

    return filename
        .replace(/\.md$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, letra =>
            letra.toUpperCase()
        );
}


// ============================================================
// NOVA NOTÍCIA
// ============================================================

function novaNoticia() {

    noticiaEmEdicao = null;


    limparFormulario();


    document
        .getElementById("form-title")
        .innerText =
            "Nova Notícia";


    document
        .getElementById("mode-label")
        .innerText =
            "Criar uma nova notícia";


    document
        .getElementById("save-button-text")
        .innerText =
            "Publicar Notícia";


    document
        .getElementById("delete-button")
        .classList
        .add("hidden");


    document
        .getElementById("list-screen")
        .classList
        .add("hidden");


    document
        .getElementById("form-screen")

// ============================================================
// PARSER DO MARKDOWN
// ============================================================

function separarFrontmatter(markdown) {

    const match =
        markdown.match(
            /^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/
        );


    if (!match) {

        return {

            fields: {},

            body: markdown
        };
    }


    const frontmatter =
        match[1];


    const body =
        match[2];


    const fields = {};


    frontmatter
        .split("\n")
        .forEach(line => {

            const matchLine =
                line.match(
                    /^([A-Za-z_]+):\s*(.*)$/
                );


            if (!matchLine) return;


            const key =
                matchLine[1];


            let value =
                matchLine[2].trim();


            if (
                value.startsWith('"') &&
                value.endsWith('"')
            ) {

                try {

                    value =
                        JSON.parse(
                            value
                        );

                } catch (e) {

                    value =
                        value.slice(
                            1,
                            -1
                        );
                }
            }


            if (
                value.startsWith("'") &&
                value.endsWith("'")
            ) {

                value =
                    value.slice(
                        1,
                        -1
                    );
            }


            fields[key] =
                value;
        });


    return {

        fields,

        body
    };
}


function obterCampo(
    fields,
    ...nomes
) {

    for (
        const nome of nomes
    ) {

        if (
            fields[nome] !== undefined &&
            fields[nome] !== null &&
            fields[nome] !== ""
        ) {

            return fields[nome];
        }
    }


    return "";
}


// ============================================================
// PREENCHER FORMULÁRIO
// ============================================================

function preencherFormulario(
    markdown
) {

    const parsed =
        separarFrontmatter(
            markdown
        );


    const fields =
        parsed.fields;


    const titulo =
        obterCampo(
            fields,
            "title"
        );


    const subtitulo =
        obterCampo(
            fields,
            "subtitulo",
            "subtitle",
            "descricao",
            "resumo"
        );


    const categoria =
        obterCampo(
            fields,
            "categoria",
            "category",
            "tag"
        );


    const data =
        obterCampo(
            fields,
            "date",
            "published"
        );


    const autor =
        obterCampo(
            fields,
            "author"
        ) ||
        "ChutaPraCanto";


    const imagem =
        obterCampo(
            fields,
            "imagem",
            "image",
            "featured_image",
            "featuredImage"
        );


    document
        .getElementById(
            "noticia-titulo"
        )
        .value =
            titulo;


    document
        .getElementById(
            "noticia-subtitulo"
        )
        .value =
            subtitulo;


    document
        .getElementById(
            "noticia-categoria"
        )
        .value =
            categoria;


    document
        .getElementById(
            "noticia-autor"
        )
        .value =
            autor;


    if (data) {

        const dataLimpa =
            data.substring(
                0,
                10
            );


        document
            .getElementById(
                "noticia-data"
            )
            .value =
                dataLimpa;

    } else {

        document
            .getElementById(
                "noticia-data"
            )
            .value =
                "";
    }


    document
        .getElementById(
            "noticia-imagem-url"
        )
        .value =
            imagem;


    mostrarPreview(
        imagem
    );


    quill.setText("");


    const html =
        markdownSimplesParaHtml(
            parsed.body
        );


    quill.clipboard.dangerouslyPasteHTML(
        html
    );
}


// ============================================================
// MARKDOWN -> HTML
// ============================================================

function markdownSimplesParaHtml(
    markdown
) {

    let html =
        escaparHtml(
            markdown
        );


    html =
        html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );


    html =
        html.replace(
            /^\*\*(.*?)\*\*$/gm,
            "<p><strong>$1</strong></p>"
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /^\* (.*)$/gm,
            "<li>$1</li>"
        );


    html =
        html.replace(
            /(<li>.*<\/li>)/gs,
            "<ul>$1</ul>"
        );


    html =
        html.replace(
            /\n\n+/g,
            "</p><p>"
        );


    html =
        "<p>" +
        html +
        "</p>";


    html =
        html.replace(
            /<p>\s*<\/p>/g,
            ""
        );


    html =
        html.replace(
            /<p>\s*(<h3>)/g,
            "$1"
        );


    html =
        html.replace(
            /(<\/h3>)\s*<\/p>/g,
            "$1"
        );


    return html;
}

// GUARDAR / PUBLICAR
// ============================================================

async function guardarNoticia() {

    const token =
        getToken();


    if (!token) {

        alert(
            "Sessão não encontrada."
        );

        return;
    }


    const titulo =
        document
            .getElementById(
                "noticia-titulo"
            )
            .value
            .trim();


    const subtitulo =
        document
            .getElementById(
                "noticia-subtitulo"
            )
            .value
            .trim();


    const categoria =
        document
            .getElementById(
                "noticia-categoria"
            )
            .value
            .trim();


    const data =
        document
            .getElementById(
                "noticia-data"
            )
            .value;


    const autor =
        document
            .getElementById(
                "noticia-autor"
            )
            .value
            .trim();


    const imgUrl =
        document
            .getElementById(
                "noticia-imagem-url"
            )
            .value
            .trim();


    const statusEl =
        document.getElementById(
            "status"
        );


    if (
        !titulo ||
        !quill ||
        quill.getText().trim().length === 0
    ) {

        alert(
            "O título e o conteúdo são obrigatórios."
        );

        return;
    }


    statusEl.style.display =
        "block";


    statusEl.style.background =
        "#fef3c7";


    statusEl.style.color =
        "#92400e";


    statusEl.innerText =
        "A guardar...";


    try {

        let finalImageUrl =
            imgUrl;


        const imageData =
            await uploadImage();


        if (imageData) {

            const uniqueName =
                criarNomeImagemUnico(
                    imageData.name
                );


            const imagePath =
                `images/uploads/${uniqueName}`;


            const imageBody = {

                message:
                    "Upload imagem: " +
                    uniqueName,

                content:
                    imageData.content,

                branch:
                    BRANCH
            };


            await githubFetch(

                `https://api.github.com/repos/${REPO}/contents/${imagePath}`,

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            imageBody
                        )
                }
            );


            finalImageUrl =
                `/images/uploads/${uniqueName}`;
        }


        const htmlContent =
            quill.root.innerHTML;


        const turndownService =
            new TurndownService();


        const markdownBody =
            turndownService.turndown(
                htmlContent
            );


        // NOVA NOTÍCIA
        if (!noticiaEmEdicao) {

            const slug =
                criarSlug(
                    titulo
                );


            const filename =
                `content/noticias/${slug}.md`;


            const fileContent =
                construirMarkdown(

                    titulo,

                    subtitulo,

                    categoria,

                    data,

                    autor,

                    finalImageUrl,

                    markdownBody
                );


            await githubFetch(

                `https://api.github.com/repos/${REPO}/contents/${filename}`,

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                "Nova notícia: " +
                                titulo,

                            content:
                                encodeBase64(
                                    fileContent
                                ),

                            branch:
                                BRANCH
                        })
                }
            );


            mostrarSucesso(
                "Notícia publicada com sucesso!"
            );

        }


        // EDITAR NOTÍCIA EXISTENTE
        else {

            const fileContent =
                construirMarkdown(

                    titulo,

                    subtitulo,

                    categoria,

                    data,

                    autor,

                    finalImageUrl,

                    markdownBody
                );


            await githubFetch(

                `https://api.github.com/repos/${REPO}/contents/${noticiaEmEdicao.path}`,

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                "Editar notícia: " +
                                titulo,

                            content:
                                encodeBase64(
                                    fileContent
                                ),

                            branch:
                                BRANCH,

                            sha:
                                noticiaEmEdicao.sha
                        })
                }
            );


            mostrarSucesso(
                "Notícia atualizada com sucesso!"
            );
        }


    } catch (error) {

        statusEl.style.display =
            "block";


        statusEl.style.background =
            "#fee2e2";


        statusEl.style.color =
            "#991b1b";


        statusEl.innerText =
            "Erro: " +
            error.message;
    }
}


// ============================================================
// CONSTRUIR MARKDOWN
// ============================================================

function construirMarkdown(
    titulo,
    subtitulo,
    categoria,
    data,
    autor,
    imagem,
    body
) {

    return `---
title: ${yamlQuote(titulo)}
subtitulo: ${yamlQuote(subtitulo)}
categoria: ${yamlQuote(categoria)}
date: ${yamlQuote(data)}
author: ${yamlQuote(autor)}
imagem: ${yamlQuote(imagem)}
---

${body}
`;
}


function yamlQuote(value) {

    return JSON.stringify(
        value || ""
    );
}

// APAGAR
// ============================================================

async function apagarNoticia() {

    if (!noticiaEmEdicao) {
        return;
    }


    const confirmar =
        confirm(
            "Tens a certeza que queres apagar esta notícia?\n\nEsta ação não pode ser desfeita através deste painel."
        );


    if (!confirmar) {
        return;
    }


    try {

        await githubFetch(

            `https://api.github.com/repos/${REPO}/contents/${noticiaEmEdicao.path}`,

            {

                method:
                    "DELETE",

                headers: {

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        message:
                            "Apagar notícia",

                        sha:
                            noticiaEmEdicao.sha,

                        branch:
                            BRANCH
                    })
            }
        );


        alert(
            "Notícia apagada."
        );


        voltarLista();


    } catch (error) {

        alert(

            "Não foi possível apagar a notícia:\n\n" +

        );
    }
}


// ============================================================
// IMAGEM
// ============================================================

async function uploadImage() {

    const fileInput =
        document.getElementById(
            "image-upload"
        );


    if (
        !fileInput.files.length
    ) {

        return null;
    }


    const file =
        fileInput.files[0];


    const reader =
        new FileReader();


    return new Promise(
        (resolve, reject) => {

            reader.onloadend =
                () => {

                    try {

                        const base64Content =
                            reader.result
                                .split(",")[1];


                        resolve({

                            name:
                                file.name,

                            content:
                                base64Content
                        });


                    } catch (error) {

                        reject(error);
                    }
                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );
        }
    );
}


function criarNomeImagemUnico(
    filename
) {

    const ultimaExtensao =
        filename.lastIndexOf(".");


    let nome =
        ultimaExtensao > 0
            ? filename.substring(
                0,
                ultimaExtensao
            )
            : filename;


    let extensao =
        ultimaExtensao > 0
            ? filename.substring(
                ultimaExtensao
            )
            : "";


    nome =
        nome
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /[^a-zA-Z0-9_-]+/g,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                ""
            );


    extensao =
        extensao
            .toLowerCase()
            .replace(
                /[^a-z0-9.]/g,
                ""
            );


    if (!nome) {
        nome = "imagem";
    }


    const agora =
        new Date();


    const timestamp =
        agora
            .toISOString()
            .replace(
                /[-:.TZ]/g,
                ""
            );


    const aleatorio =
        Math.random()
            .toString(36)
            .substring(
                2,
                7
            );


    return (
        nome +
        "-" +
        timestamp +
        "-" +
        aleatorio +
        extensao
    );
}

    preview.style.display =

// ============================================================
// UTILITÁRIOS
// ============================================================

function criarSlug(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-z0-9]+/g,
            "-"
        )

        .replace(
            /^-+|-+$/g,
            ""
        );
}


function encodeBase64(texto) {

    return btoa(

        unescape(

            encodeURIComponent(
                texto
            )
        )
    );
}


function decodeBase64(base64) {

    const cleaned =
        base64.replace(
            /\n/g,
            ""
        );


    return decodeURIComponent(

        escape(

            atob(
                cleaned
            )
        )
    );
}


function escaparHtml(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
