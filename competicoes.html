<style>
.competitions-page{max-width:1180px;margin:0 auto;padding:2.5rem 1rem 4rem}
.competitions-intro{margin-bottom:1.5rem}.competitions-intro h1{font:700 clamp(2rem,5vw,3rem) var(--font-title);margin:0 0 .5rem}.competitions-intro p{color:var(--text-gray);max-width:760px;margin:0}
.competition-tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.25rem 0 1rem;scrollbar-width:thin}
.competition-tabs button{flex:0 0 auto;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-gray);border-radius:999px;padding:.65rem .9rem;font:700 .78rem var(--font-title);cursor:pointer;white-space:nowrap}
.competition-tabs button.active{color:#07100a;background:var(--neon-green);border-color:var(--neon-green)}
.competition-status{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin:0 0 1rem;padding:.8rem 1rem;border:1px solid var(--border-color);border-radius:10px;background:var(--card-bg);color:var(--text-gray);font-size:.82rem}
.competition-status strong{color:var(--text-color)}
.competition-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:1.25rem}
.competition-panel{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;overflow:hidden}
.competition-panel h2{font:700 1.05rem var(--font-title);margin:0;padding:1rem 1.1rem;border-bottom:1px solid var(--border-color)}
.fixtures{padding:.65rem 1rem}.fixture{display:grid;grid-template-columns:5.2rem 1fr 1fr;gap:.75rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border-color);font-size:.88rem}.fixture:last-child{border-bottom:0}.fixture-time{color:var(--text-gray);font-size:.76rem}.fixture-team{text-align:right}.fixture-team.away{text-align:left}.fixture-score{font:700 .9rem var(--font-title);text-align:center;min-width:2.2rem}
.table-wrap{overflow-x:auto}.standings{width:100%;border-collapse:collapse;font-size:.8rem}.standings th,.standings td{padding:.65rem .55rem;border-bottom:1px solid var(--border-color);text-align:right}.standings th:first-child,.standings td:first-child,.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.standings th{color:var(--text-gray);font:700 .68rem var(--font-title);text-transform:uppercase}.standings td:first-child{color:var(--neon-green);font-weight:700}.empty,.error{padding:1.2rem;color:var(--text-gray)}.error{color:#ff9b9b}
@media(max-width:820px){.competition-grid{grid-template-columns:1fr}.competition-status{align-items:flex-start;flex-direction:column}.fixture{grid-template-columns:4.6rem 1fr 1fr}}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1556367149800029" crossorigin="anonymous"></script>
</head>
<body>
<header class="site-header"><div class="header-container">
<a href="/" class="logo-link" aria-label="Chuta Pra Canto — início"><img src="/images/logo.png" alt="Chuta Pra Canto" class="site-logo" decoding="async" fetchpriority="low"></a>
<nav aria-label="Navegação principal"><ul>
<li><a href="/">Home</a></li><li><a href="/noticias">Notícias</a></li><li><a href="/opiniao">Opinião</a></li><li><a href="/competicoes" class="active" aria-current="page">Competições</a></li><li><a href="/sobre">Sobre Nós</a></li><li><a href="/contacto">Contacto</a></li>
</ul></nav>
<div class="header-socials"><a href="https://youtube.com/@chutapracanto" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a><a href="https://www.instagram.com/chutapracanto/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></div>
</div></header>
<main class="competitions-page">
<section class="competitions-intro"><h1>Competições</h1><p>Jogos, resultados e classificações das competições acompanhadas pelo Chuta Pra Canto.</p></section>
<div class="competition-tabs" id="competition-tabs" role="tablist" aria-label="Competições"></div>
<div class="competition-status"><span id="competition-name"><strong>A carregar…</strong></span><span id="updated">A obter dados…</span></div>
<div class="competition-grid">
<section class="competition-panel"><h2>Jogos e resultados</h2><div id="fixtures" class="fixtures"><div class="empty">A carregar…</div></div></section>
<section class="competition-panel"><h2>Classificação</h2><div id="standings"><div class="empty">A carregar…</div></div></section>
</div>
</main>
<script>
const competitions=[
["liga-portugal","Liga Portugal"],["taca-portugal","Taça de Portugal"],["taca-liga","Taça da Liga"],["champions-league","UEFA Champions League"],["europa-league","UEFA Europa League"],["conference-league","UEFA Conference League"],["nations-league","UEFA Nations League"]
];
const tabs=document.getElementById("competition-tabs"),fixturesEl=document.getElementById("fixtures"),standingsEl=document.getElementById("standings"),nameEl=document.getElementById("competition-name"),updatedEl=document.getElementById("updated");
let active="";
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function dateLabel(value){if(!value)return "—";const d=new Date(value);if(Number.isNaN(d.getTime()))return "—";return new Intl.DateTimeFormat("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function renderTabs(){tabs.innerHTML=competitions.map(([key,label])=>`<button type="button" class="${key===active?"active":""}" role="tab" aria-selected="${key===active}" data-key="${key}">${label}</button>`).join("");tabs.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>loadCompetition(b.dataset.key)))}
function renderFixtures(items){
 if(!items.length){fixturesEl.innerHTML='<div class="empty">Não há jogos disponíveis neste momento.</div>';return}
 fixturesEl.innerHTML=items.slice(0,30).map(item=>{
  const home=esc(item.homeTeam?.name||"Casa"),away=esc(item.awayTeam?.name||"Fora");
  const hs=item.score?.home??item.homeScore??null, as=item.score?.away??item.awayScore??null;
  const score=hs!=null||as!=null?`${esc(hs??"—")}–${esc(as??"—")}`:"—";
  return `<div class="fixture"><div class="fixture-time">${dateLabel(item.kickoff||item.startAt||item.date)}</div><div class="fixture-team">${home}</div><div class="fixture-team away"><span class="fixture-score">${score}</span> ${away}</div></div>`;
 }).join("");
}
function renderStandings(rows){
 if(!rows.length){standingsEl.innerHTML='<div class="empty">Esta competição não disponibiliza uma classificação neste formato.</div>';return}
 standingsEl.innerHTML='<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>'+rows.slice(0,30).map((row,i)=>`<tr><td>${esc(row.position??i+1)}</td><td>${esc(row.team?.name||"—")}</td><td>${esc(row.played??row.games??"—")}</td><td>${esc(row.wins??"—")}</td><td>${esc(row.draws??"—")}</td><td>${esc(row.losses??"—")}</td><td>${esc(row.goalDifference??row.gd??"—")}</td><td>${esc(row.points??"—")}</td></tr>`).join("")+'</tbody></table></div>';
}
async function loadCompetition(key){
 active=key;renderTabs();nameEl.innerHTML="<strong>A carregar…</strong>";updatedEl.textContent="A obter dados…";fixturesEl.innerHTML='<div class="empty">A carregar…</div>';standingsEl.innerHTML='<div class="empty">A carregar…</div>';
 try{
  const response=await fetch("/api/competicoes?competition="+encodeURIComponent(key),{cache:"no-store"});
  const data=await response.json();
  if(!response.ok)throw new Error(data?.message||"Não foi possível obter os dados.");
  nameEl.innerHTML="<strong>"+esc(data.competition?.name||competitions.find(c=>c[0]===key)?.[1]||key)+"</strong> · "+esc(data.season?.label||"Época atual");
  updatedEl.textContent="Atualizado "+dateLabel(data.updatedAt)+" · "+(data.updateStatus==="cache"?"cache":"dados atuais");
  renderFixtures(Array.isArray(data.fixtures)?data.fixtures:[]);
  renderStandings(Array.isArray(data.standings)?data.standings:[]);
 }catch(error){
  nameEl.innerHTML="<strong>Dados indisponíveis</strong>";updatedEl.textContent="";fixturesEl.innerHTML='<div class="error">'+esc(error.message)+'</div>';standingsEl.innerHTML='<div class="empty">Sem dados.</div>';
 }
}
active=new URLSearchParams(location.search).get("competition")||"liga-portugal";if(!competitions.some(c=>c[0]===active))active="liga-portugal";loadCompetition(active);
</script>
</body></html>
