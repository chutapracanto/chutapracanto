<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média | ChutaPraCanto</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html">Notícias</a></li>
        <li><a href="media.html" class="active">Média</a></li>
        <li><a href="index.html#equipa">Equipa</a></li>
      </ul>
    </nav>
  </header>

  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
    
    <div class="section-header" style="margin-bottom: 2.5rem;">
      <h1 class="section-title">Central de Média</h1>
    </div>

    <!-- SECÇÃO 1: VÍDEOS CURTOS -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          ⚡ VÍDEOS CURTOS
        </h2>
        <div>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', -1)">‹</button>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', 1)">›</button>
        </div>
      </div>

      <div class="media-carousel vertical-aspect" id="carousel-shorts">
        <p style="color: #888;">A carregar Vídeos Curtos...</p>
      </div>
    </section>

    <!-- SECÇÃO 2: VIDEO PODCASTS -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          🎙️ VIDEO PODCASTS & EPISÓDIOS
        </h2>
        <div>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', -1)">‹</button>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', 1)">›</button>
        </div>
      </div>

      <div class="media-carousel horizontal-aspect" id="carousel-podcasts">
        <p style="color: #888;">A carregar Podcasts...</p>
      </div>
    </section>

    <!-- SECÇÃO 3: PODCAST NO SPOTIFY -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          🎧 PODCAST NO SPOTIFY
        </h2>
      </div>

      <div style="width: 100%;">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/show/0340sfCl6p2dYzSyU7J3Tv?utm_source=generator&theme=0" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </section>

  </div>

  <footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
  </footer>

  <script>
    function scrollCarousel(id, direction) {
      const carousel = document.getElementById(id);
      const scrollAmount = 320;
      carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    async function carregarPlaylist(playlistId, containerId, isShort = false) {
      const url = `https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
      const container = document.getElementById(containerId);

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          data.items.forEach(item => {
            let videoId = '';
            if (item.link.includes('v=')) {
              videoId = item.link.split('v=')[1].split('&')[0];
            } else if (item.link.includes('shorts/')) {
              videoId = item.link.split('shorts/')[1].split('?')[0];
            } else {
              videoId = item.guid.split(':')[2];
            }

            const div = document.createElement('div');
            div.className = 'carousel-item';
            
            // Adiciona parâmetros para permitir a incorporação de Shorts
            const embedUrl = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
            
            div.innerHTML = `<iframe src="${embedUrl}" title="${item.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<p style="color:#888;">Nenhum vídeo encontrado.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color:#888;">Erro ao carregar vídeos.</p>';
      }
    }

    carregarPlaylist('PLUXnJ5IDIDWU', 'carousel-shorts', true);
    carregarPlaylist('PLIhiPRVaH-qs', 'carousel-podcasts', false);
  </script>

</body>
</html>
