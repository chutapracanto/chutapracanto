<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média | ChutaPraCanto</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER / NAVEGAÇÃO -->
  <header>
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html">Notícias</a></li>
        <li><a href="media.html" class="active">Média</a></li>
        <li><a href="index.html#equipa">Equipa</a></li>
      </ul>
    </nav>
  </header>

  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
    
    <div class="section-header" style="margin-bottom: 2.5rem;">
      <h1 class="section-title">Central de Média</h1>
    </div>

    <!-- SECCÃO 1: SHORTS & VÍDEOS CURTOS -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          ⚡ SHORTS & VÍDEOS CURTOS
        </h2>
        <div>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', -1)">‹</button>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', 1)">›</button>
        </div>
      </div>

      <div class="media-carousel vertical-aspect" id="carousel-shorts">
        <!-- Incorporação do leitor de Playlist de Shorts -->
        <div class="carousel-item short-item">
          <iframe src="https://www.youtube.com/embed/videoseries?list=PLUXnJ5IDIDWU" title="ChutaPraCanto Shorts" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- SECÇÃO 2: VIDEO PODCASTS (YOUTUBE) -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          🎙️ VIDEO PODCASTS & EPISÓDIOS
        </h2>
        <div>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', -1)">‹</button>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', 1)">›</button>
        </div>
      </div>

      <div class="media-carousel horizontal-aspect" id="carousel-podcasts">
        <!-- Incorporação do leitor de Playlist de Podcasts -->
        <div class="carousel-item video-item">
          <iframe src="https://www.youtube.com/embed/videoseries?list=PLIhiPRVaH-qs" title="ChutaPraCanto Podcasts" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- SECÇÃO 3: PODCASTS EM ÁUDIO (SPOTIFY / ANCHOR) -->
    <section style="margin-bottom: 3.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--neon-green, #00ff66); font-size: 1.3rem; margin: 0;">
          🎧 PODCAST NO SPOTIFY
        </h2>
        <div>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-spotify', -1)">‹</button>
          <button class="arrow-btn" onclick="scrollCarousel('carousel-spotify', 1)">›</button>
        </div>
      </div>

      <div class="media-carousel spotify-aspect" id="carousel-spotify">
        <div class="carousel-item spotify-item">
          <!-- Player embed do Spotify através do teu programa -->
          <iframe style="border-radius:12px" src="https://open.spotify.com/embed/show/5v7L32x3Jb5a..." width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </div>
    </section>

  </div>

  <footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
  </footer>

  <script>
    function scrollCarousel(id, direction) {
      const carousel = document.getElementById(id);
      const scrollAmount = 320;
      carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }
  </script>

</body>
</html>
