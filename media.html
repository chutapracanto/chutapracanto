<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média | ChutaPraCanto</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #0b0e14; color: #fff; font-family: system-ui, sans-serif; margin: 0; }
    .media-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .section-title-green { color: #00ff66; font-size: 1.3rem; margin: 0; font-weight: 700; }
    
    /* BOTÕES */
    .btn-external { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; font-weight: 600; transition: all 0.2s; }
    
    .btn-youtube { color: #fff; border: 1px solid #ff0000; }
    .btn-youtube:hover { background-color: #ff0000; color: #fff; }
    
    .btn-spotify { color: #00ff66; border: 1px solid #00ff66; }
    .btn-spotify:hover { background-color: #00ff66; color: #000; }
    
    /* CARROSSEL GERAL (YOUTUBE) */
    .media-carousel { display: flex; gap: 1.25rem; overflow-x: auto; scroll-behavior: smooth; padding: 0.5rem 0; scrollbar-width: none; min-height: 200px; }
    .media-carousel::-webkit-scrollbar { display: none; }
    .carousel-item { flex: 0 0 auto; background: #121824; border-radius: 12px; overflow: hidden; border: 1px solid #1f293d; }
    .carousel-item iframe { width: 100%; height: 100%; border: none; }
    
    .vertical-aspect .carousel-item { width: 240px; height: 425px; }
    .horizontal-aspect .carousel-item { width: 360px; height: 202px; }

    .arrow-btn { background: #121824; color: #00ff66; border: 1px solid #00ff66; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: all 0.2s; }
    .arrow-btn:hover { background: #00ff66; color: #000; }

    /* SECÇÃO PODCAST SPOTIFY */
    .spotify-grid { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; background: #121824; border-radius: 12px; border: 1px solid #1f293d; padding: 1.2rem; }
    @media (max-width: 768px) { .spotify-grid { grid-template-columns: 1fr; } }

    .podcast-main-cover { width: 100%; border-radius: 8px; border: 1px solid #1f293d; }
    
    /* SCROLL PERSONALIZADO */
    .episodes-scroll { display: flex; flex-direction: column; gap: 0.8rem; max-height: 280px; overflow-y: auto; padding-right: 0.5rem; }
    .episodes-scroll::-webkit-scrollbar { width: 6px; }
    .episodes-scroll::-webkit-scrollbar-thumb { background: #00ff66; border-radius: 4px; }
    .episodes-scroll::-webkit-scrollbar-thumb:active { background: #005522; }

    .episode-card { background: #0b0e14; border: 1px solid #1f293d; border-radius: 8px; padding: 0.8rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .episode-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .episode-title { font-size: 0.95rem; font-weight: 600; color: #fff; margin: 0; }
    .episode-date { font-size: 0.75rem; color: #888; }
    .audio-player { height: 32px; max-width: 220px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-link"><img src="images/logo.png" alt="ChutaPraCanto" class="site-logo"></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html">Notícias</a></li>
        <li><a href="media.html" class="active">Média</a></li>
        <li><a href="index.html#equipa">Equipa</a></li>
      </ul>
    </nav>
  </header>

  <div class="media-container">
    <h1 style="font-size: 2rem; margin-bottom: 2.5rem;">Central de Média</h1>

    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">⚡ VÍDEOS CURTOS</h2>
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <a href="https://www.youtube.com/@ChutaPraCanto/shorts" target="_blank" class="btn-external btn-youtube">Vê no YouTube ↗</a>
          <div>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', -1)">‹</button>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', 1)">›</button>
          </div>
        </div>
      </div>
      <div class="media-carousel vertical-aspect" id="carousel-shorts"><p style="color: #888; padding: 1rem;">A carregar...</p></div>
    </section>

    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">🎙️ VIDEO PODCASTS</h2>
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <a href="https://www.youtube.com/@ChutaPraCanto/podcasts" target="_blank" class="btn-external btn-youtube">Vê no YouTube ↗</a>
          <div>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', -1)">‹</button>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', 1)">›</button>
          </div>
        </div>
      </div>
      <div class="media-carousel horizontal-aspect" id="carousel-podcasts"><p style="color: #888; padding: 1rem;">A carregar...</p></div>
    </section>

    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">🎧 PODCAST NO SPOTIFY</h2>
        <a href="https://open.spotify.com/show/0340sfCl6p2dYzSyU7J3Tv" target="_blank" class="btn-external btn-spotify">Ouve no Spotify ↗</a>
      </div>
      <div class="spotify-grid">
        <div>
          <img id="podcast-cover" src="images/logo.png" alt="Podcast" class="podcast-main-cover">
          <p style="margin: 0.8rem 0 0 0; font-weight: 700; font-size: 1.1rem;" id="podcast-title">ChutaPraCanto</p>
        </div>
        <div class="episodes-scroll" id="episodes-container"><p style="color: #888;">A carregar episódios...</p></div>
      </div>
    </section>
  </div>

  <footer><p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p></footer>

  <script>
    function scrollCarousel(id, direction) {
      const carousel = document.getElementById(id);
      carousel.scrollBy({ left: direction * 300, behavior: 'smooth' });
    }
    async function carregarYouTube(playlistId, containerId) {
      const container = document.getElementById(containerId);
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`)}`;
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.status === 'ok') {
          container.innerHTML = '';
          data.items.forEach(item => {
            let videoId = item.link.includes('v=') ? item.link.split('v=')[1].split('&')[0] : item.guid.split(':')[2];
            const div = document.createElement('div');
            div.className = 'carousel-item';
            div.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
            container.appendChild(div);
          });
        }
      } catch (e) { container.innerHTML = '<p>Erro.</p>'; }
    }
    async function carregarFeedSpotify(rssUrl) {
      const container = document.getElementById('episodes-container');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.status === 'ok') {
          if (data.feed.image) document.getElementById('podcast-cover').src = data.feed.image;
          container.innerHTML = '';
          data.items.forEach(ep => {
            const dateStr = new Date(ep.pubDate).toLocaleDateString('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' });
            container.innerHTML += `<div class="episode-card"><div class="episode-info"><p class="episode-title">${ep.title}</p><span class="episode-date">${dateStr}</span></div><audio controls class="audio-player" src="${ep.enclosure.link}"></audio></div>`;
          });
        }
      } catch (e) { container.innerHTML = '<p>Erro ao carregar episódios.</p>'; }
    }
    carregarYouTube('PLUXnJ5IDIDWU', 'carousel-shorts');
    carregarYouTube('PLFJ6oHgZs4WU', 'carousel-podcasts');
    carregarFeedSpotify('https://anchor.fm/s/1159ff964/podcast/rss');
  </script>
</body>
</html>
