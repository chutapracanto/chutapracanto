<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média | ChutaPraCanto</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #0b0e14; color: #fff; font-family: system-ui, sans-serif; margin: 0; }
    .media-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .section-title-green { color: #00ff66; font-size: 1.3rem; margin: 0; font-weight: 700; }
    .btn-external { color: #00ff66; border: 1px solid #00ff66; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; font-weight: 600; transition: all 0.2s; }
    .btn-external:hover { background-color: #00ff66; color: #000; }
    
    /* CARROSSEL GERÁL */
    .media-carousel { display: flex; gap: 1.25rem; overflow-x: auto; scroll-behavior: smooth; padding: 0.5rem 0; scrollbar-width: none; min-height: 200px; }
    .media-carousel::-webkit-scrollbar { display: none; }
    
    .carousel-item { flex: 0 0 auto; background: #121824; border-radius: 12px; overflow: hidden; border: 1px solid #1f293d; }
    .carousel-item iframe { width: 100%; height: 100%; border: none; }
    
    /* DIMENSÕES ESPECÍFICAS */
    .vertical-aspect .carousel-item { width: 240px; height: 425px; }
    .horizontal-aspect .carousel-item { width: 360px; height: 202px; }

    .arrow-btn { background: #121824; color: #00ff66; border: 1px solid #00ff66; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: all 0.2s; }
    .arrow-btn:hover { background: #00ff66; color: #000; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html">Notícias</a></li>
        <li><a href="media.html" class="active">Média</a></li>
        <li><a href="index.html#equipa">Equipa</a></li>
      </ul>
    </nav>
  </header>

  <div class="media-container">
    <h1 style="font-size: 2rem; margin-bottom: 2.5rem;">Central de Média</h1>

    <!-- SECÇÃO 1: VÍDEOS CURTOS -->
    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">⚡ VÍDEOS CURTOS</h2>
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <a href="https://www.youtube.com/@ChutaPraCanto/shorts" target="_blank" rel="noopener noreferrer" class="btn-external">Vê no YouTube ↗</a>
          <div>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', -1)">‹</button>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-shorts', 1)">›</button>
          </div>
        </div>
      </div>

      <div class="media-carousel vertical-aspect" id="carousel-shorts">
        <p style="color: #888; padding: 1rem;">A carregar Vídeos Curtos...</p>
      </div>
    </section>

    <!-- SECÇÃO 2: VIDEO PODCASTS -->
    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">🎙️ VIDEO PODCASTS & EPISÓDIOS</h2>
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <a href="https://www.youtube.com/@ChutaPraCanto/podcasts" target="_blank" rel="noopener noreferrer" class="btn-external">Vê no YouTube ↗</a>
          <div>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', -1)">‹</button>
            <button class="arrow-btn" onclick="scrollCarousel('carousel-podcasts', 1)">›</button>
          </div>
        </div>
      </div>

      <div class="media-carousel horizontal-aspect" id="carousel-podcasts">
        <p style="color: #888; padding: 1rem;">A carregar Podcasts...</p>
      </div>
    </section>

    <!-- SECÇÃO 3: PODCAST NO SPOTIFY -->
    <section style="margin-bottom: 3.5rem;">
      <div class="section-header-flex">
        <h2 class="section-title-green">🎧 PODCAST NO SPOTIFY</h2>
        <a href="https://open.spotify.com/show/0340sfCl6p2dYzSyU7J3Tv" target="_blank" rel="noopener noreferrer" class="btn-external">Ouve no Spotify ↗</a>
      </div>

      <div style="background: #121824; border-radius: 12px; border: 1px solid #1f293d; overflow: hidden; padding: 8px;">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/show/0340sfCl6p2dYzSyU7J3Tv?utm_source=generator&theme=0" width="100%" height="350" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </section>
  </div>

  <footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
  </footer>

  <script>
    function scrollCarousel(id, direction) {
      const carousel = document.getElementById(id);
      carousel.scrollBy({ left: direction * 300, behavior: 'smooth' });
    }

    // Carrega vídeos do YouTube via Playlist RSS
    async function carregarYouTube(playlistId, containerId) {
      const container = document.getElementById(containerId);
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          data.items.forEach(item => {
            let videoId = item.link.includes('v=') 
              ? item.link.split('v=')[1].split('&')[0] 
              : item.guid.split(':')[2];

            const div = document.createElement('div');
            div.className = 'carousel-item';
            div.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            container.appendChild(div);
          });
        }
      } catch (e) {
        container.innerHTML = '<p style="color:#888; padding: 1rem;">Erro ao carregar conteúdo.</p>';
      }
    }

    // Carrega os carrosséis do YouTube
    carregarYouTube('PLUXnJ5IDIDWU', 'carousel-shorts');
    carregarYouTube('PLFJ6oHgZs4WU', 'carousel-podcasts');
  </script>
</body>
</html>
