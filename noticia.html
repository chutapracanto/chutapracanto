<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ChutaPraCanto | Notícia</title>
    <!-- Importa o mesmo CSS da home para manter o design -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Meta Tags para Redes Sociais -->
    <meta property="og:type" content="article" />
    <meta property="og:title" id="meta-title" content="ChutaPraCanto" />
    <meta property="og:description" id="meta-desc" content="Notícias e opinião sobre futebol." />
    <meta property="og:image" id="meta-image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
  </a>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="media.html">Média</a></li>
      <li><a href="index.html#equipa">Equipa</a></li>
    </ul>
  </nav>
</header>

<div class="container" style="padding: 40px 0; color: #fff;">
    <div id="article-content" style="max-width: 800px; margin: 0 auto;">
        <p>A carregar notícia...</p>
    </div>

    <!-- Botão Único de Partilha -->
    <div class="share-section" id="share-box" style="display:none; text-align: center; margin-top: 40px;">
        <button class="btn-neon" onclick="partilharNoticia()" style="cursor: pointer; padding: 12px 24px; font-size: 16px;">
            🔗 Partilhar Notícia
        </button>
    </div>
</div>

<footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
    <div class="footer-links">
      <a href="#">Sobre Nós</a>
      <a href="#">Contacto</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function loadArticle() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        if(!slug) {
            document.getElementById('article-content').innerHTML = "<h2>Notícia não encontrada.</h2>";
            return;
        }

        try {
            const res = await fetch(`content/noticias/${slug}.md`);
            if(!res.ok) throw new Error("Artigo não existe");
            const text = await res.text();

            const parts = text.split("---");
            const frontmatter = parts[1];
            const markdownBody = parts.slice(2).join("---");

            const getMeta = (key) => {
                const match = frontmatter.match(new RegExp(`${key}:\\s*"([^"]+)"`));
                return match ? match[1] : '';
            };

            const title = getMeta('title');
            const subtitulo = getMeta('subtitulo');
            const categoria = getMeta('categoria');
            const date = getMeta('date');
            const imagem = getMeta('imagem');

            document.getElementById('page-title').innerText = title + " | ChutaPraCanto";
            document.getElementById('meta-title').content = title;
            document.getElementById('meta-desc').content = subtitulo;
            if(imagem) document.getElementById('meta-image').content = window.location.origin + imagem;

            const htmlBody = marked.parse(markdownBody);
            
            // Aqui usamos as classes do teu CSS (como .news-card, etc, se necessário)
            document.getElementById('article-content').innerHTML = `
                <span class="tag">${categoria || 'SL BENFICA'}</span>
                <h1 style="margin: 15px 0;">${title}</h1>
                <div class="meta-info" style="color: #888; margin-bottom: 20px;">Por ChutaPraCanto • ${date}</div>
                ${imagem ? `<img src="${imagem}" style="width: 100%; border-radius: 8px; margin-bottom: 25px;" alt="${title}">` : ''}
                <p style="font-size: 1.2rem; color: #ccc; margin-bottom: 30px;">${subtitulo}</p>
                <div class="article-body" style="font-size: 1.1rem; line-height: 1.8;">${htmlBody}</div>
            `;
            
            document.getElementById('share-box').style.display = "block";

        } catch (e) {
            document.getElementById('article-content').innerHTML = "<h2>Erro ao carregar a notícia.</h2>";
        }
    }

    async function partilharNoticia() {
        const title = document.getElementById('meta-title').content;
        const url = window.location.href;
        if (navigator.share) {
            await navigator.share({ title, url }).catch(() => {});
        } else {
            navigator.clipboard.writeText(url);
            alert('Link copiado!');
        }
    }

    loadArticle();
</script>
</body>
</html>
