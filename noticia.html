<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ChutaPraCanto | Notícia</title>
    <!-- CSS oficial do site -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Meta Tags para Redes Sociais -->
    <meta property="og:type" content="article" />
    <meta property="og:title" id="meta-title" content="ChutaPraCanto" />
    <meta property="og:description" id="meta-desc" content="Notícias e opinião sobre futebol." />
    <meta property="og:image" id="meta-image" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        /* Estilo do botão de partilha estilo Spotify */
        .btn-spotify-style {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-spotify-style:hover {
            background-color: rgba(57, 255, 20, 0.1);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
  </a>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="media.html">Média</a></li>
      <li><a href="index.html#equipa">Equipa</a></li>
    </ul>
  </nav>
</header>

<div class="article-container">
    <!-- Botão Voltar -->
    <a href="index.html" class="back-btn">← VOLTAR ÀS NOTÍCIAS</a>

    <!-- Conteúdo gerado dinamicamente -->
    <div id="article-content">
        <p style="color: var(--text-gray);">A carregar notícia...</p>
    </div>

    <!-- Botão de Partilha Estilo Spotify -->
    <div class="share-section" id="share-box" style="display:none; margin-top: 40px; text-align: right;">
        <button class="btn-spotify-style" onclick="partilharNoticia()">
            Partilhar Notícia ↗
        </button>
    </div>
</div>

<footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
    <div class="footer-links">
      <a href="#">Sobre Nós</a>
      <a href="#">Contacto</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function loadArticle() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        if(!slug) {
            document.getElementById('article-content').innerHTML = "<h2>Notícia não encontrada.</h2>";
            return;
        }

        try {
            const res = await fetch(`content/noticias/${slug}.md`);
            if(!res.ok) throw new Error("Artigo não existe");
            const text = await res.text();

            const parts = text.split("---");
            const frontmatter = parts[1];
            const markdownBody = parts.slice(2).join("---");

            const getMeta = (key) => {
                const match = frontmatter.match(new RegExp(`${key}:\\s*"([^"]+)"`));
                return match ? match[1] : '';
            };

            const title = getMeta('title');
            const subtitulo = getMeta('subtitulo');
            const categoria = getMeta('categoria');
            const date = getMeta('date');
            const imagem = getMeta('imagem');

            document.getElementById('page-title').innerText = title + " | ChutaPraCanto";
            document.getElementById('meta-title').content = title;
            document.getElementById('meta-desc').content = subtitulo;
            if(imagem) document.getElementById('meta-image').content = window.location.origin + imagem;

            const htmlBody = marked.parse(markdownBody);
            
            // Ordem correta aproveitando as classes limpas do style.css (pontos nas listas, fontes corretas, etc.)
            document.getElementById('article-content').innerHTML = `
                <span class="article-category">${categoria || 'SL BENFICA'}</span>
                <h1 id="art-titulo">${title}</h1>
                <p class="art-subtitulo">${subtitulo}</p>
                <div class="art-meta">Publicado em ${date || 'recente'} por ChutaPraCanto</div>
                
                ${imagem ? `<img src="${imagem}" alt="${title}" class="art-img">` : ''}
                
                <div class="art-body">${htmlBody}</div>
            `;
            
            document.getElementById('share-box').style.display = "block";

        } catch (e) {
            document.getElementById('article-content').innerHTML = "<h2>Erro ao carregar a notícia.</h2>";
        }
    }

    async function partilharNoticia() {
        const title = document.getElementById('meta-title').content;
        const url = window.location.href;
        if (navigator.share) {
            await navigator.share({ title, url }).catch(() => {});
        } else {
            navigator.clipboard.writeText(url);
            alert('Link copiado para a área de transferência!');
        }
    }

    loadArticle();
</script>
</body>
</html>
