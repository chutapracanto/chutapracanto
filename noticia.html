<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChutaPraCanto - Notícia</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para ler Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

<!-- HEADER -->
<header>
    <a href="index.html" class="logo-link">
        <img src="assets/logo.png" alt="ChutaPraCanto" class="site-logo">
    </a>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#noticias">Notícias</a></li>
            <li><a href="media.html">Média</a></li>
            <li><a href="equipa.html">Equipa</a></li>
        </ul>
    </nav>
</header>

<!-- CONTEÚDO DA NOTÍCIA -->
<div class="article-container">
    <!-- Botão Voltar -->
    <a href="index.html" class="back-btn">← VOLTAR ÀS NOTÍCIAS</a>

    <div id="article-content">
        <p style="color: var(--text-gray);">A carregar notícia...</p>
    </div>

    <!-- Botão de Partilha -->
    <div class="share-section" id="share-box" style="display:none; margin-top: 40px; text-align: right;">
        <button class="btn-neon" onclick="partilharNoticia()">
            Partilhar Notícia ↗
        </button>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
</footer>

<!-- SCRIPT DE LEITURA DA NOTÍCIA -->
<script>
    async function carregarNoticia() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const contentDiv = document.getElementById('article-content');

        if (!slug) {
            contentDiv.innerHTML = '<p style="color: red;">Notícia não encontrada.</p>';
            return;
        }

        try {
            // Vai buscar o ficheiro .md correspondente ao slug na pasta content/noticias/
            const response = await fetch(`content/noticias/${slug}.md`);
            if (!response.ok) throw new Error("Erro ao carregar o artigo");

            const text = await response.text();
            
            // Separar o Frontmatter (metadados YAML) do corpo da notícia (Markdown)
            const parts = text.split('---');
            if (parts.length < 3) throw new Error("Formato do artigo inválido");

            const metadata = jsyaml.load(parts[1]);
            const markdownBody = parts.slice(2).join('---');
            const htmlBody = marked.parse(markdownBody);

            // Injetar na ordem exata pretendida (igual ao Framer)
            contentDiv.innerHTML = `
                <span class="article-category">${metadata.categoria || "SL BENFICA"}</span>
                <h1 id="art-titulo">${metadata.title}</h1>
                <p class="art-subtitulo">${metadata.subtitulo || ""}</p>
                <div class="art-meta">Publicado em ${metadata.date || ""} por ${metadata.author || "ChutaPraCanto"}</div>
                
                ${metadata.imagem ? `<img src="${metadata.imagem}" alt="${metadata.title}" class="art-img">` : ''}
                
                <div class="art-body">${htmlBody}</div>
            `;
            
            document.getElementById('share-box').style.display = "block";

        } catch (error) {
            console.error(error);
            contentDiv.innerHTML = '<p style="color: red;">Erro ao carregar o conteúdo da notícia.</p>';
        }
    }

    function partilharNoticia() {
        if (navigator.share) {
            navigator.share({
                title: document.title,
                url: window.location.href
            }).catch(console.error);
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("Link copiado para a área de transferência!");
        }
    }

    carregarNoticia();
</script>

</body>
</html>
