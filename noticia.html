<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia | ChutaPraCanto</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

  <header>
  <a href="index.html" class="logo-link">
    <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
  </a>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="index.html#shorts">Shorts</a></li>
      <li><a href="index.html#equipa">Equipa</a></li>
    </ul>
  </nav>
</header>

  <div class="container" style="max-width: 800px; margin-top: 2rem;">
    <article id="artigo-container">
      <p style="color: var(--text-gray);">A carregar o artigo...</p>
    </article>
  </div>

  <footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
  </footer>

  <script>
    async function carregarArtigo() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      if (!slug) {
        window.location.href = 'noticias.html';
        return;
      }

      try {
        const response = await fetch(`https://raw.githubusercontent.com/chutapracanto/chutapracanto/main/content/noticias/${slug}.md`);
        if (!response.ok) {
          document.getElementById('artigo-container').innerHTML = '<h2>Artigo não encontrado.</h2>';
          return;
        }

        const text = await response.text();
        const parts = text.split('---');

        if (parts.length < 3) return;

        const metadata = jsyaml.load(parts[1]);
        const markdownContent = parts.slice(2).join('---');
        const htmlContent = marked.parse(markdownContent);

        const container = document.getElementById('artigo-container');
        document.title = `${metadata.title} | ChutaPraCanto`;

        container.innerHTML = `
          <span class="tag" style="font-size: 0.9rem;">${metadata.tag || 'Geral'}</span>
          <h1 style="font-size: 2.2rem; margin: 0.8rem 0; line-height: 1.2;">${metadata.title}</h1>
          ${metadata.imagem ? `<img src="${metadata.imagem}" alt="${metadata.title}" style="width: 100%; border-radius: 12px; margin: 1.5rem 0;">` : ''}
          <div style="font-size: 1.1rem; line-height: 1.8; color: #d0d0d0;" class="artigo-corpo">
            ${htmlContent}
          </div>
          <div style="margin-top: 3rem;">
            <a href="noticias.html" class="btn-neon">← Voltar às Notícias</a>
          </div>
        `;
      } catch (error) {
        console.error('Erro ao carregar o artigo:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', carregarArtigo);
  </script>
</body>
</html>
