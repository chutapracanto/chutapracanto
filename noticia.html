<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ChutaPraCanto</title>
    
    <!-- Meta Tags para Redes Sociais -->
    <meta property="og:type" content="article" />
    <meta property="og:title" id="meta-title" content="ChutaPraCanto" />
    <meta property="og:description" id="meta-desc" content="Notícias e opinião sobre futebol." />
    <meta property="og:image" id="meta-image" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; background: #f9fafb; margin: 0; padding: 0; }
        .article-container { max-width: 700px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 28px; color: #111; margin-bottom: 10px; }
        .meta-info { font-size: 14px; color: #666; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .cover-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 25px; }
        .content { font-size: 17px; color: #222; margin-bottom: 40px; }
        
        /* Botão Único de Partilha Nativo */
        .share-section { border-top: 1px solid #eee; padding-top: 25px; margin-top: 40px; text-align: center; }
        .btn-share { background: #2563eb; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-share:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="article-container">
    <div id="article-content">
        <p>A carregar notícia...</p>
    </div>

    <!-- Botão Único de Partilha -->
    <div class="share-section" id="share-box" style="display:none;">
        <button class="btn-share" onclick="partilharNoticia()">
            🔗 Partilhar Notícia
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function loadArticle() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        if(!slug) {
            document.getElementById('article-content').innerHTML = "<h2>Notícia não encontrada.</h2>";
            return;
        }

        try {
            const res = await fetch(`content/noticias/${slug}.md`);
            if(!res.ok) throw new Error("Artigo não existe");
            const text = await res.text();

            const parts = text.split("---");
            const frontmatter = parts[1];
            const markdownBody = parts.slice(2).join("---");

            const getMeta = (key) => {
                const match = frontmatter.match(new RegExp(`${key}:\\s*"([^"]+)"`));
                return match ? match[1] : '';
            };

            const title = getMeta('title');
            const subtitulo = getMeta('subtitulo');
            const categoria = getMeta('categoria');
            const date = getMeta('date');
            const imagem = getMeta('imagem');

            // Atualizar Meta Tags
            document.getElementById('page-title').innerText = title + " | ChutaPraCanto";
            document.getElementById('meta-title').content = title;
            document.getElementById('meta-desc').content = subtitulo;
            if(imagem) document.getElementById('meta-image').content = window.location.origin + imagem;

            // Desenhar conteúdo
            const htmlBody = marked.parse(markdownBody);
            document.getElementById('article-content').innerHTML = `
                <span style="background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;">${categoria || 'SL BENFICA'}</span>
                <h1>${title}</h1>
                <div class="meta-info">Por ChutaPraCanto • ${date}</div>
                ${imagem ? `<img src="${imagem}" class="cover-image" alt="${title}">` : ''}
                <p style="font-size: 18px; font-weight: 500; color: #555;">${subtitulo}</p>
                <div class="content">${htmlBody}</div>
            `;
            
            document.getElementById('share-box').style.display = "block";

        } catch (e) {
            document.getElementById('article-content').innerHTML = "<h2>Erro ao carregar a notícia.</h2>";
        }
    }

    // Função de Partilha Nativa (abre o menu do telemóvel/PC ou copia o link)
    async function partilharNoticia() {
        const title = document.getElementById('meta-title').content;
        const url = window.location.href;

        if (navigator.share) {
            try {
                await navigator.share({
                    title: title,
                    url: url
                });
            } catch (err) {
                console.log('Partilha cancelada');
            }
        } else {
            navigator.clipboard.writeText(url);
            alert('Link copiado para a área de transferência!');
        }
    }

    loadArticle();
</script>

</body>
</html>
