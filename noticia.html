<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia | ChutaPraCanto</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Biblioteca para converter Markdown em HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <img src="images/logo.png" alt="ChutaPraCanto" class="site-logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="noticias.html">Notícias</a></li>
          <li><a href="sobre.html">Sobre Nós</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO DA NOTÍCIA -->
  <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    <div id="noticia-conteudo">
      <p style="color: var(--text-gray); text-align: center; padding: 3rem 0;">A carregar notícia...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <div class="footer-brand">
        <img src="images/logo.png" alt="ChutaPraCanto" class="footer-logo">
        <p>Análise tática, debate pós-jogo e opinião sem filtro sobre o futebol mundial.</p>
      </div>
      <div class="footer-links">
        <h4>NAVEGAÇÃO</h4>
        <a href="index.html">Home</a>
        <a href="noticias.html">Notícias</a>
        <a href="sobre.html">Sobre Nós</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2026 ChutaPraCanto. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    async function carregarArtigoIndividual() {
      const container = document.getElementById('noticia-conteudo');
      
      // Obter o slug do URL (ex: noticia.html?slug=nome-do-artigo)
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        container.innerHTML = '<p style="color: #ff4444; text-align: center;">Notícia não encontrada.</p>';
        return;
      }

      const repo = "chutapracanto/chutapracanto";
      const branch = "main";
      const urlFicheiro = `https://raw.githubusercontent.com/${repo}/${branch}/content/noticias/${slug}.md`;

      try {
        const resposta = await fetch(urlFicheiro);
        if (!resposta.ok) throw new Error("Artigo não encontrado.");

        const textoMd = await resposta.text();

        // Separar o Frontmatter (cabeçalho YAML) do corpo da notícia
        const partes = textoMd.split('---');
        if (partes.length < 3) throw new Error("Formato do artigo inválido.");

        const cabecalho = partes[1];
        const corpoMarkdown = partes.slice(2).join('---'); // Tudo o resto é o corpo

        // Função auxiliar para extrair campos do cabeçalho YAML
        const extrairCampo = (campo) => {
          const match = cabecalho.match(new RegExp(`${campo}:\\s*"([^"]*)"`)) || cabecalho.match(new RegExp(`${campo}:\\s*(.*)`));
          return match ? match[1].replace(/"/g, '').trim() : '';
        };

        const titulo = extrairCampo('title');
        const subtitulo = extrairCampo('subtitle');
        const tag = extrairCampo('category') || 'FUTEBOL';
        const data = extrairCampo('date');
        const imagem = extrairCampo('imagem');

        // Converter o corpo de Markdown para HTML usando a biblioteca 'marked'
        const corpoHtml = marked.parse(corpoMarkdown);

        // Montar o layout da página da notícia
        container.innerHTML = `
          <div style="margin-bottom: 1.5rem;">
            <span style="color: var(--neon-green, #00ff66); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">${tag}</span>
            <h1 style="font-size: 2.2rem; color: #fff; margin: 0.5rem 0 1rem 0; line-height: 1.2;">${titulo}</h1>
            ${subtitulo ? `<p style="font-size: 1.1rem; color: var(--text-gray, #aaa); line-height: 1.5; margin-bottom: 1rem;">${subtitulo}</p>` : ''}
            ${data ? `<p style="font-size: 0.8rem; color: #666; margin-bottom: 1.5rem;">Publicado a ${data}</p>` : ''}
          </div>

          ${imagem ? `<div style="width: 100%; max-height: 450px; overflow: hidden; border-radius: 12px; margin-bottom: 2rem; border: 1px solid var(--border-color, #222);"><img src="${imagem}" style="width: 100%; height: 100%; object-fit: cover;" alt="${titulo}"></div>` : ''}

          <div class="artigo-corpo" style="color: #ddd; font-size: 1rem; line-height: 1.8;">
            ${corpoHtml}
          </div>
        `;

      } catch (erro) {
        console.error(erro);
        container.innerHTML = '<p style="color: #ff4444; text-align: center; padding: 3rem 0;">Erro ao carregar o artigo. Tenta novamente mais tarde.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', carregarArtigoIndividual);
  </script>

  <style>
    /* Estilos extra para o conteúdo gerado em Markdown dentro do artigo */
    .artigo-corpo h2 { color: #fff; font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; }
    .artigo-corpo h3 { color: #fff; font-size: 1.25rem; margin-top: 1.5rem; margin-bottom: 0.75rem; }
    .artigo-corpo p { margin-bottom: 1.2rem; }
    .artigo-corpo ul, .artigo-corpo ol { margin-bottom: 1.2rem; padding-left: 1.5rem; }
    .artigo-corpo li { margin-bottom: 0.5rem; }
    .artigo-corpo strong { color: #fff; }
    .artigo-corpo blockquote { border-left: 3px solid var(--neon-green, #00ff66); padding-left: 1rem; margin: 1.5rem 0; color: #aaa; font-style: italic; }
  </style>
</body>
</html>
