<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias | ChutaPraCanto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root { var(--neon): #39ff14; var(--bg): #0a0c0e; --card-bg: #111418; --card-border: #1e242c; --text-muted: #8a96a3; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0c0e; color: #ffffff; font-family: 'Inter', sans-serif; }
    a { color: inherit; text-decoration: none; }
    .pixel-font { font-family: 'Press Start 2P', monospace; }

    header { background: #050607; border-bottom: 1px solid #1e242c; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1rem; color: #fff; font-weight: 900; }
    nav ul { display: flex; gap: 2rem; list-style: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
    nav a:hover { color: #39ff14; }

    .container { max-width: 900px; margin: 0 auto; padding: 2.5rem 1rem; }
    .page-title { font-size: 1.5rem; margin-bottom: 2rem; }

    .news-grid-all { display: flex; flex-direction: column; gap: 1.5rem; }
    .news-full-card {
      background: #111418;
      border: 1px solid #1e242c;
      border-radius: 10px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 1.5rem;
    }
    .news-full-img { width: 100%; height: 130px; border-radius: 6px; object-fit: cover; }
    .news-tag { color: #39ff14; font-size: 0.6rem; font-weight: 800; margin-bottom: 0.5rem; }
    .news-full-title { font-size: 1rem; font-weight: 900; margin-bottom: 0.5rem; line-height: 1.3; }
    .news-full-desc { color: #8a96a3; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo pixel-font">ChutaPraCanto</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html" style="color: #39ff14;">Notícias</a></li>
        <li><a href="shorts.html">Shorts</a></li>
        <li><a href="podcast.html">Podcast</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1 class="page-title pixel-font">TODAS AS NOTÍCIAS</h1>
    <div class="news-grid-all" id="all-news"></div>
  </div>

  <script>
    async function loadAllNews() {
      const res = await fetch('./noticias.json');
      const news = await res.json();

      document.getElementById('all-news').innerHTML = news.map(item => `
        <div class="news-full-card">
          <img src="${item.imagem}" class="news-full-img" alt="${item.titulo}">
          <div>
            <div class="news-tag pixel-font">${item.tag}</div>
            <h2 class="news-full-title pixel-font">${item.titulo}</h2>
            <p class="news-full-desc">${item.descricao}</p>
          </div>
        </div>
      `).join('');
    }

    loadAllNews();
  </script>
</body>
</html>
