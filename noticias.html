<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias | ChutaPraCanto</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

  <header>
    <div class="logo">ChutaPraCanto</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="noticias.html">Notícias</a></li>
        <li><a href="index.html#shorts">Shorts</a></li>
        <li><a href="index.html#equipa">Equipa</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="section-header" style="margin-top: 2rem;">
      <h1 class="section-title">Todas as Notícias</h1>
    </div>

    <div class="news-grid" id="noticias-grid">
      <p style="color: var(--text-gray);">A carregar todas as notícias...</p>
    </div>
  </div>

  <footer>
    <p>© 2026 ChutaPraCanto. Futebol e opinião tática.</p>
  </footer>

  <script>
    async function carregarTodasNoticias() {
      try {
        const response = await fetch('https://api.github.com/repos/chutapracanto/chutapracanto/contents/content/noticias');
        if (!response.ok) return;
        
        const files = await response.json();
        const grid = document.getElementById('noticias-grid');
        grid.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const text = await res.text();
            
            const parts = text.split('---');
            if (parts.length < 3) continue;
            
            const data = jsyaml.load(parts[1]);
            const slug = file.name.replace('.md', '');
            
            const title = data.title || 'Sem título';
            const tag = data.tag || 'Geral';
            const imagem = data.imagem || 'https://via.placeholder.com/600x400';
            const descricao = data.descricao || data.resumo || '';

            const card = document.createElement('a');
            card.href = `noticia.html?slug=${slug}`;
            card.className = 'news-card';
            
            card.innerHTML = `
              <div style="width: 100%; aspect-ratio: 16/9; overflow: hidden;">
                <img src="${imagem}" alt="${title}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <div style="padding: 1.25rem;">
                <span class="tag">${tag}</span>
                <h3 style="margin: 0.5rem 0; font-size: 1.1rem; line-height: 1.4;">${title}</h3>
                <p style="color: var(--text-gray); font-size: 0.9rem; margin-top: 0.5rem;">${descricao}</p>
              </div>
            `;
            grid.appendChild(card);
          }
        }
      } catch (error) {
        console.error('Erro ao carregar notícias:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', carregarTodasNoticias);
  </script>
</body>
</html>
